services:
  - type: web
    name: politeknik-course-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "postgres"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
